services:
  # Public Frontend Web Server (accessible on port 8086)
  web-frontend:
    image: nginx:alpine
    container_name: web-frontend
    ports:
      - "8086:80"
    networks:
      - frontend-net
    restart: always

  # Backend API (bridges frontend-net and backend-net)
  api-service:
    image: alpine
    container_name: api-service
    command: sh -c "apk add --no-cache curl && tail -f /dev/null"
    networks:
      - frontend-net
      - backend-net
    restart: always

  # Isolated Database Service (only accessible on backend-net)
  db-service:
    image: redis:alpine
    container_name: db-service
    networks:
      - backend-net
    restart: always

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
